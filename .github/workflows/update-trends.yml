name: Auto-Update Game Trends & Niche Intelligence

on:
  schedule:
    # Run daily at 06:00 UTC (automated unattended execution)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow one-click manual run in GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/update-trends.yml'

permissions:
  contents: write

jobs:
  update-trends:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Run Market Intelligence Pipeline (AppMagic & Sensor Tower)
        run: |
          node scripts/update-market-intelligence.mjs

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trends/data/market-data.js trends/data/*.json
          git diff --staged --quiet || git commit -m "chore: auto-update market intelligence data [$(date -u +%Y-%m-%d)]"
          git push
