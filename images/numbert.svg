<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect width="480" height="480" x="16" y="16" rx="88" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" />
  
  <!-- Numbert Math & Brain Grid Icon -->
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Grid Box 1: Number 7 -->
    <rect x="96" y="96" width="136" height="136" rx="24" fill="#ffffff" fill-opacity="0.2" />
    <text x="164" y="192" font-family="-apple-system, Arial, sans-serif" font-size="90" font-weight="900" text-anchor="middle" fill="#ffffff">7</text>

    <!-- Grid Box 2: Math Plus -->
    <rect x="280" y="96" width="136" height="136" rx="24" fill="#ffffff" fill-opacity="0.2" />
    <text x="348" y="196" font-family="-apple-system, Arial, sans-serif" font-size="96" font-weight="900" text-anchor="middle" fill="#ffffff">+</text>

    <!-- Grid Box 3: Brain IQ Icon -->
    <rect x="96" y="280" width="136" height="136" rx="24" fill="#ffffff" fill-opacity="0.2" />
    <text x="164" y="380" font-family="-apple-system, Arial, sans-serif" font-size="96" font-weight="900" text-anchor="middle" fill="#ffffff">IQ</text>

    <!-- Grid Box 4: Number 3 -->
    <rect x="280" y="280" width="136" height="136" rx="24" fill="#ffffff" fill-opacity="0.2" />
    <text x="348" y="376" font-family="-apple-system, Arial, sans-serif" font-size="90" font-weight="900" text-anchor="middle" fill="#ffffff">3</text>
  </g>
</svg>
